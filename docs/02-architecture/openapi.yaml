    OnboardingStatus:
      type: string
      description: Derived server state, not a user_profiles column. No completed validated profile means NOT_STARTED; completed validated profile means COMPLETED. IN_PROGRESS is local draft state; ineligible input does not create a completed profile or target. Completion is not proof of an active nutrition recommendation.
      enum:
      - NOT_STARTED
      - COMPLETED
    GoalType:
      type: string
      description: Approved structural vocabulary only; clinical preset policies remain OPEN. Target weight is required for cutting/bulking and must be valid whenever supplied.
      enum:
      - maintenance
      - cutting
      - bulking
      - muscle_gain
    ActivityLevel:
      type: string
      description: Approved structural codes for one overall activity level; factors and clinical descriptions remain OPEN.
      enum:
      - very_low
      - light
      - moderate
      - high
      - very_high
    CalculationParameter:
      type: string
      minLength: 1
      pattern: '\S'
      description: Nonempty structured code, not inferred from body-type or gender identity. Clinical value set, syntax details and compatibility are OPEN. Backend must reject unapproved values; no enum or fallback is fabricated here.
    IdentityHeightCm:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
      not:
        pattern: '^0(\.0+)?$'
      description: Positive finite decimal-string cm for numeric(8,2). Backend rejects overflow and excess precision before PostgreSQL coercion; no silent rounding or NaN/infinity.
    IdentityWeightKg:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$'
      not:
        pattern: '^0(\.0+)?$'
      description: Positive finite decimal-string kg for numeric(10,3), including target weight. Backend rejects overflow and excess precision before PostgreSQL coercion; no silent rounding or NaN/infinity. Current weight belongs to weight measurements, not a profile column.
