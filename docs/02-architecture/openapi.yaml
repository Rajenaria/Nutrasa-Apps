openapi: 3.1.0
info:
  title: NUTRASA MVP API
  version: 1.5.0-draft
  description: 'Typed engineering review draft. Not production approved; see contract-hardening-review-v1.4.md.
    Offline conflict rule: server-ordered LWW, NOT actual physical action time.

    Contract review draft, NOT approved for client generation or production. Domain, security and request bodies
    require full semantic lint and integration review.

    M03-01A identity structure is owner-approved, not implemented. Completion transport for preferences,
    eligibility and versioned privacy acknowledgement is OPEN; no fields or endpoints are inferred here.
    Clinical calculation-parameter values, factors and safety thresholds, combined-approval legal validity,
    retention/withdrawal/backups and initial weight/goal persistence dependencies remain OPEN for features.
    Structural identity FKs/defaults are finalized in postgres-physical-schema-v1.5.md; this permits writing/testing
    migration 0001_identity.sql before completion features exist, without claiming operational onboarding.
    Identity profile/preferences are created atomically only after complete server validation; no partial
    profiles or database onboarding_status column. Profile existence alone does not establish an active target.'
servers:
- url: http://localhost:3000
  description: Trusted local development only
tags:
- name: Account
- name: Analytics
- name: Catalog
- name: Favorites
- name: Goals
- name: Health
- name: Identity
- name: Journal
- name: Onboarding
- name: Profile
- name: Sync
- name: Weight
- name: custom-foods
- name: recipes
- name: saved-meals
paths:
  /api/v1/health/live:
    get:
      tags:
      - Health
      summary: Liveness
      description: Public minimal probe implemented since M01. Returns status directly, without the domain data/meta envelope.
      operationId: get_health_live
      responses:
        '200':
          description: Process is alive; no dependency readiness or server details are exposed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
                required:
                - status
              example:
                status: ok
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /api/v1/health/ready:
    get:
      tags:
      - Health
      summary: Readiness
      description: Planned dependency readiness contract; not implemented. The current backend returns HTTP 404 NOT_FOUND.
      operationId: get_health_ready
      responses:
        '200':
          description: Planned successful readiness response; not currently implemented.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
        '404':
          description: NOT_FOUND while dependency readiness is not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security: []
