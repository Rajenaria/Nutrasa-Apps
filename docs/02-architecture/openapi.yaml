                    $ref: '#/components/schemas/Meta'
                required:
                - data
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403': &id003
          description: Not eligible or deleting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422': &id004
          description: Nutrition or serving unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429': &id005
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500': &id006
          $ref: '#/components/responses/InternalServerError'
        '409':
          description: Idempotency key reused with mismatched payload or immutable domain conflict (not normal LWW)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      security:
      - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID unique per logical mutation; retries reuse same UUID and identical payload
        schema: &id008
          type: string
          format: uuid
