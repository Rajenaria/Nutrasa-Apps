      tags:
      - Analytics
      summary: Progress weight
      operationId: get_me_progress_weight
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProgressWeightData'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id007
        '422': *id004
        '429': *id005
        '500': *id006
      security:
      - FirebaseBearer: []
      parameters:
      - name: from
        in: query
        required: true
        schema: *id011
      - name: to
        in: query
        required: true
        schema: *id011
  /api/v1/me/progress/consistency:
    get:
      tags:
      - Analytics
      summary: Progress consistency
      operationId: get_me_progress_consistency
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ProgressConsistencyData'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id007
        '422': *id004
        '429': *id005
        '500': *id006
      security:
      - FirebaseBearer: []
      parameters:
      - name: from
        in: query
        required: true
        schema: *id011
      - name: to
        in: query
        required: true
        schema: *id011
  /api/v1/me/sync/push:
    post:
      tags:
      - Sync
      summary: Push ordered idempotent changes
      operationId: post_me_sync_push
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data: &id015
                    type: object
                    additionalProperties: false
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/SyncResult'
                      cursor:
                        oneOf:
                        - *id009
                        - type: 'null'
                    required:
                    - results
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id007
        '422': *id004
        '429': *id005
        '500': *id006
        '409':
          description: Idempotency key reused with different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      security:
      - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPush'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID unique per logical mutation; retries reuse same UUID and identical payload
        schema: *id008
      description: The HTTP Idempotency-Key deduplicates the envelope. Each operation_id separately deduplicates
        the logical mutation. Commit entity mutations, operation receipts, feed events, and cursor advancement atomically.
  /api/v1/me/sync/pull:
    get:
      tags:
      - Sync
      summary: Pull scoped change feed
      operationId: get_me_sync_pull
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/SyncPullPage'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id007
        '422': *id004
        '429': *id005
        '500': *id006
        '410':
          description: 'Cursor expired: retain pending outbox and perform full resync'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - FirebaseBearer: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id009
      description: First request without cursor returns a consistent baseline and snapshot watermark via implementation-defined
        bootstrap; expired cursor returns 410 CURSOR_EXPIRED. A resync must not delete pending local mutations.
  /api/v1/me/account/deletion-request:
    post:
      tags:
      - Account
      summary: Start durable coordinated deletion
      operationId: post_me_account_deletion_request
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/DeletionStatus'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id007
        '422': *id004
        '429': *id005
        '500': *id006
        '409':
          description: Idempotency key reused with mismatched payload or immutable domain conflict (not normal LWW)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
      security:
      - FirebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: UUID unique per logical mutation; retries reuse same UUID and identical payload
        schema: *id008
  /api/v1/me/account/deletion-status:
    get:
      tags:
      - Account
      summary: Read deletion status
      operationId: get_me_account_deletion_status
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/DeletionStatus'
                  meta:
                    $ref: '#/components/schemas/Meta'
                required:
                - data
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id007
        '422': *id004
        '429': *id005
        '500': *id006
      security:
      - FirebaseBearer: []
components:
  responses:
    BadRequest:
      description: INVALID_REQUEST for malformed input; VALIDATION_FAILED for Fastify JSON Schema validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            malformed:
              value:
                error:
                  code: INVALID_REQUEST
                  message: Invalid request.
                request_id: req-1
            validation:
              value:
                error:
                  code: VALIDATION_FAILED
                  message: Request validation failed.
                request_id: req-1
    PayloadTooLarge:
      description: HTTP 413 INVALID_REQUEST; request body exceeds the server limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: INVALID_REQUEST
              message: Invalid request.
            request_id: req-1
    UnsupportedMediaType:
      description: HTTP 415 INVALID_REQUEST; request body media type is unsupported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: INVALID_REQUEST
              message: Invalid request.
            request_id: req-1
    InternalServerError:
      description: SERVER_ERROR; safe message without internal error details or stack traces.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: SERVER_ERROR
              message: An internal server error occurred.
            request_id: req-1
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    Nutrients:
      type: object
      additionalProperties: false
      properties:
        energy_kcal:
          oneOf:
          - &id012
            type: string
            pattern: ^\d+(\.\d{1,5})?$
            description: Decimal >= 0, validation/upper bounds enforced by server
          - type: 'null'
        protein_g:
          oneOf:
          - *id012
          - type: 'null'
        carbohydrate_g:
          oneOf:
          - *id012
          - type: 'null'
        fat_g:
          oneOf:
          - *id012
          - type: 'null'
        fiber_g:
          oneOf:
          - *id012
          - type: 'null'
        sugar_g:
          oneOf:
          - *id012
          - type: 'null'
        saturated_fat_g:
          oneOf:
          - *id012
          - type: 'null'
        trans_fat_g:
          oneOf:
          - *id012
          - type: 'null'
        cholesterol_mg:
          oneOf:
          - *id012
          - type: 'null'
        sodium_mg:
          oneOf:
          - *id012
          - type: 'null'
        potassium_mg:
          oneOf:
          - *id012
          - type: 'null'
      required: &id013
      - energy_kcal
      - protein_g
      - carbohydrate_g
      - fat_g
      - fiber_g
      - sugar_g
      - saturated_fat_g
      - trans_fat_g
      - cholesterol_mg
      - sodium_mg
      - potassium_mg
    NutrientCoverage:
      type: object
      additionalProperties: false
      properties:
        nutrient_code:
          type: string
          enum: *id013
        known_sum:
          oneOf:
          - *id012
          - type: 'null'
        known_count:
          type: integer
          minimum: 0
        unknown_count:
          type: integer
          minimum: 0
        coverage_status:
          type: string
          enum:
          - COMPLETE
          - PARTIAL
          - UNKNOWN
        display_hint:
          type: string
          enum:
          - EXACT
          - AT_LEAST
          - UNAVAILABLE
      required:
      - nutrient_code
      - known_sum
      - known_count
      - unknown_count
      - coverage_status
      - display_hint
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Safe human-readable error message; no internal details or sensitive payloads.
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
        request_id:
          type: string
          description: Server-generated request identifier; UUID format is not required.
      required:
      - error
      - request_id
    Meta:
      type: object
      additionalProperties: true
      properties:
        request_id: *id009
        next_cursor:
          oneOf:
          - *id009
          - type: 'null'
    IdResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          type: object
          additionalProperties: false
          properties:
            id: *id010
          required:
          - id
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
    User:
      type: object
      additionalProperties: false
      properties:
        user_id: *id010
        account_status:
          $ref: '#/components/schemas/AccountStatus'
        email_verified:
          type: boolean
          description: Authoritative Firebase verification state obtained through trusted backend verification; nullable email_verified_cache in PostgreSQL is not false by default. Verification is optional for onboarding/main features/sync. Firebase–Fastify integration is still OPEN.
        onboarding_status:
          $ref: '#/components/schemas/OnboardingStatus'
      required:
      - user_id
      - account_status
      - email_verified
      - onboarding_status
    OnboardingInput:
      type: object
      additionalProperties: false
      description: Complete onboarding input, never a server draft. Backend validates adult eligibility and approved calculation parameters before creating profile/preferences atomically. Acknowledgement, preferences and eligibility transport plus initial weight/AUTO goal persistence remain OPEN; this schema alone does not finalize completion.
      properties:
        date_of_birth:
          type: string
          format: date
          description: Full birth date persisted as PostgreSQL DATE with privacy controls; backend evaluates age 18+ and eligibility, not a CURRENT_DATE-based CHECK.
        height_cm:
          $ref: '#/components/schemas/IdentityHeightCm'
        weight_kg:
          $ref: '#/components/schemas/IdentityWeightKg'
        calculation_parameter:
          $ref: '#/components/schemas/CalculationParameter'
        activity_level:
          $ref: '#/components/schemas/ActivityLevel'
        goal_type:
          $ref: '#/components/schemas/GoalType'
        target_weight_kg:
          oneOf:
          - $ref: '#/components/schemas/IdentityWeightKg'
          - type: 'null'
        body_type_visual:
          description: Optional cosmetic choice; never a nutrition-engine input.
          oneOf:
          - type: string
          - type: 'null'
      required:
      - date_of_birth
      - height_cm
      - weight_kg
      - calculation_parameter
      - activity_level
      - goal_type
      allOf:
      - if:
          properties:
            goal_type:
              enum:
              - cutting
              - bulking
          required:
          - goal_type
        then:
          required:
          - target_weight_kg
          properties:
            target_weight_kg:
              $ref: '#/components/schemas/IdentityWeightKg'
    ProfilePatch:
      type: object
      additionalProperties: false
      description: Validate the merged persisted profile, including required target weight for cutting/bulking. Transport for DOB/calculation_parameter edits is OPEN; do not infer missing request fields. Existing profile does not prove an active AUTO target.
      properties:
        height_cm:
          $ref: '#/components/schemas/IdentityHeightCm'
        activity_level:
          $ref: '#/components/schemas/ActivityLevel'
        goal_type:
          $ref: '#/components/schemas/GoalType'
        target_weight_kg:
          oneOf:
          - $ref: '#/components/schemas/IdentityWeightKg'
          - type: 'null'
        body_type_visual:
          oneOf:
          - type: string
          - type: 'null'
    PreferencesPatch:
      type: object
      additionalProperties: false
      description: Persisted preferences are created with a completed profile, not from initial display defaults. Completion transport and language_code versus display-locale mapping remain OPEN.
      properties:
        language_code:
          type: string
          minLength: 1
        time_zone:
          type: string
          minLength: 1
          description: Backend-validated IANA timezone; never assume Asia/Jakarta from country. No default timezone is approved.
        preferred_weight_unit:
          type: string
          enum:
          - kg
          - lb
    Food:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        canonical_name: *id009
        current_published_revision_id: *id010
        basis_quantity: *id012
        basis_unit:
          type: string
          enum:
          - g
          - ml
        nutrients:
          $ref: '#/components/schemas/Nutrients'
        publication_status:
          type: string
          enum:
          - PUBLISHED
      required:
      - id
      - canonical_name
      - current_published_revision_id
      - basis_quantity
      - basis_unit
      - nutrients
      - publication_status
    FoodLogInput:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        journal_date: *id011
        journal_time_zone: *id009
        meal_type:
          $ref: '#/components/schemas/MealType'
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        source_revision_id: *id010
        quantity: *id012
        unit: *id009
      required:
      - id
      - journal_date
      - journal_time_zone
      - meal_type
      - source_kind
      - source_revision_id
      - quantity
      - unit
    FoodLogPatch:
      type: object
      additionalProperties: false
      properties:
        quantity: *id012
        unit: *id009
        journal_date: *id011
        meal_type:
          $ref: '#/components/schemas/MealType'
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        source_revision_id: *id010
    FoodLog:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        journal_date: *id011
        journal_time_zone: *id009
        meal_type:
          $ref: '#/components/schemas/MealType'
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        source_revision_id: *id010
        quantity: *id012
        unit: *id009
        nutrient_snapshot:
          $ref: '#/components/schemas/Nutrients'
        revision:
          type: integer
          minimum: 1
        deleted_at:
          oneOf:
          - &id014
            type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - journal_date
      - journal_time_zone
      - meal_type
      - source_kind
      - source_revision_id
      - quantity
      - unit
      - nutrient_snapshot
      - revision
    WeightInput:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        measured_at: *id014
        journal_date: *id011
        journal_time_zone: *id009
        weight_kg: *id012
      required:
      - id
      - measured_at
      - journal_date
      - journal_time_zone
      - weight_kg
    WeightPatch:
      type: object
      additionalProperties: false
      properties:
        measured_at: *id014
        journal_date: *id011
        journal_time_zone: *id009
        weight_kg: *id012
    Goal:
      type: object
      additionalProperties: false
      properties:
        id: *id010
        goal_mode:
          type: string
          enum:
          - AUTO
        effective_from: *id014
        effective_to:
          oneOf:
          - *id014
          - type: 'null'
        energy_kcal: *id012
        protein_g: *id012
        carbohydrate_g: *id012
        fat_g: *id012
        formula_version: *id009
      required:
      - id
      - goal_mode
      - effective_from
      - energy_kcal
      - protein_g
      - carbohydrate_g
      - fat_g
      - formula_version
    SyncOperation:
      type: object
      additionalProperties: false
      properties:
        operation_id: *id010
        device_sequence:
          type: integer
          minimum: 1
        entity_type:
          $ref: '#/components/schemas/SyncEntityType'
        entity_id: *id010
        kind:
          $ref: '#/components/schemas/SyncOperationKind'
        payload:
          type: object
          additionalProperties: true
      required:
      - operation_id
      - device_sequence
      - entity_type
      - entity_id
      - kind
      - payload
    SyncPush:
      type: object
      additionalProperties: false
      properties:
        device_id: *id010
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'
          minItems: 1
          maxItems: 100
          description: Sorted strictly by device_sequence for this device; server checks sequence progression and
            per-operation idempotency.
      required:
      - device_id
      - operations
    SyncResult:
      type: object
      additionalProperties: false
      properties:
        operation_id: *id010
        status:
          $ref: '#/components/schemas/SyncOperationStatus'
          description: APPLIED, REPLAYED or REJECTED per logical operation; client retains rejected items for reconciliation.
        error_code:
          oneOf:
          - *id009
          - type: 'null'
      required:
      - operation_id
      - status
    SyncPushResult:
      type: object
      additionalProperties: false
      properties:
        data: *id015
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
    SyncChange:
      type: object
      additionalProperties: false
      properties:
        cursor: *id009
        entity_type: *id009
        entity_id: *id010
        change_type:
          type: string
          enum:
          - UPSERT
          - DELETE
        revision:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: true
      required:
      - cursor
      - entity_type
      - entity_id
      - change_type
      - revision
    Dashboard:
      type: object
      additionalProperties: false
      properties:
        journal_date: *id011
        day_status:
          type: string
          enum:
          - NO_LOGS
          - LOGGED
        completion_status:
          $ref: '#/components/schemas/CompletionStatus'
        nutrition_coverage:
          type: array
          items:
            $ref: '#/components/schemas/NutrientCoverage'
        goal:
          oneOf:
          - $ref: '#/components/schemas/Goal'
          - type: 'null'
      required:
      - journal_date
      - day_status
      - completion_status
      - nutrition_coverage
    CompletionInput:
      type: object
      additionalProperties: false
      properties:
        completion_status:
          $ref: '#/components/schemas/CompletionStatus'
      required:
      - completion_status
    DeletionStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - REQUESTED
          - PROCESSING
          - COMPLETED
          - FAILED_RETRYABLE
          - NEEDS_REVIEW
      required:
      - status
    SourceReference:
      type: object
      additionalProperties: false
      properties:
        source_kind:
          $ref: '#/components/schemas/SourceKind'
        source_id: *id008
        source_revision_id: *id008
      required:
      - source_kind
      - source_id
      - source_revision_id
    RecipeIngredientInput:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/SourceReference'
        quantity: &id016
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,5})?$
          description: Nonnegative decimal string; no JS float for authoritative calculations
        unit:
          type: string
          enum:
          - g
          - ml
        position:
          type: integer
