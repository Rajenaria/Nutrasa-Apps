      required:
      - source
      - quantity
      - unit
      - position
    RecipeWrite:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        name: &id017
          type: string
          minLength: 1
        yield_quantity: *id016
        yield_unit:
          type: string
          enum:
          - g
          - ml
        ingredients:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RecipeIngredientInput'
      required:
      - id
      - name
      - yield_quantity
      - yield_unit
      - ingredients
    CustomFoodWrite:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        name: *id017
        basis_quantity: *id016
        basis_unit:
          type: string
          enum:
          - g
          - ml
        nutrients:
          $ref: '#/components/schemas/Nutrients'
      required:
      - id
      - name
      - basis_quantity
      - basis_unit
      - nutrients
    SavedMealItemInput:
      type: object
      additionalProperties: false
      properties:
        source:
          $ref: '#/components/schemas/SourceReference'
        quantity: *id016
        unit:
          type: string
          enum:
          - g
          - ml
        meal_type:
          $ref: '#/components/schemas/MealType'
      required:
      - source
      - quantity
      - unit
      - meal_type
    SavedMealWrite:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        name: *id017
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SavedMealItemInput'
      required:
      - id
      - name
      - items
    NutrientDayValue:
      type: object
      additionalProperties: false
      properties:
        known_sum: *id016
        known_count:
          type: integer
          minimum: 0
        unknown_count:
          type: integer
          minimum: 0
        coverage_status:
          type: string
          enum:
          - COMPLETE
          - PARTIAL
          - UNKNOWN
      required:
      - known_sum
      - known_count
      - unknown_count
      - coverage_status
    NutritionDayPoint:
      type: object
      additionalProperties: false
      properties:
        date: &id018
          type: string
          format: date
        journal_status:
          type: string
          enum:
          - NO_LOGS
          - LOGGED_OPEN
          - LOGGED_COMPLETE
        energy:
          $ref: '#/components/schemas/NutrientDayValue'
        protein:
          $ref: '#/components/schemas/NutrientDayValue'
        carbohydrate:
          $ref: '#/components/schemas/NutrientDayValue'
